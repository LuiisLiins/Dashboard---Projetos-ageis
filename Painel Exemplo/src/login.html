<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Login | Panorama Corporativo</title>
  </head>
  <body
    x-data="{ ...createAppShell('login'), email: '', senha: '' }"
    :class="{'dark bg-gray-900': darkMode === true}"
    class="flex min-h-screen items-center justify-center bg-gray-50"
  >
    <include src="./partials/preloader.html"></include>
    <div class="fixed top-5 right-5 z-[99999] flex flex-col gap-2" style="pointer-events: none; width: 340px;">
      <template x-for="toast in toasts" :key="toast.id">
        <div
          x-show="toast.visible"
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="opacity-0 translate-x-8"
          x-transition:enter-end="opacity-100 translate-x-0"
          x-transition:leave="transition ease-in duration-200"
          x-transition:leave-start="opacity-100 translate-x-0"
          x-transition:leave-end="opacity-0 translate-x-8"
          class="flex w-full items-start gap-3 rounded-xl border p-4 shadow-lg"
          style="pointer-events: all;"
          :class="{
            'bg-white border-success-200 dark:bg-gray-900 dark:border-success-700': toast.type === 'success',
            'bg-white border-error-200 dark:bg-gray-900 dark:border-error-700': toast.type === 'error',
            'bg-white border-warning-200 dark:bg-gray-900 dark:border-warning-700': toast.type === 'warning',
            'bg-white border-blue-200 dark:bg-gray-900 dark:border-blue-700': toast.type === 'info'
          }"
        >
          <div class="mt-0.5 shrink-0">
            <span x-show="toast.type === 'success'" class="flex h-6 w-6 items-center justify-center rounded-full bg-success-100 dark:bg-success-500/20">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-success-600 dark:text-success-400"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </span>
            <span x-show="toast.type === 'error'" class="flex h-6 w-6 items-center justify-center rounded-full bg-error-100 dark:bg-error-500/20">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-error-600 dark:text-error-400"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </span>
            <span x-show="toast.type === 'warning'" class="flex h-6 w-6 items-center justify-center rounded-full bg-warning-100 dark:bg-warning-500/20">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-warning-600 dark:text-warning-400"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            </span>
            <span x-show="toast.type === 'info'" class="flex h-6 w-6 items-center justify-center rounded-full bg-blue-100 dark:bg-blue-500/20">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-blue-600 dark:text-blue-400"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            </span>
          </div>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-semibold text-gray-800 dark:text-white/90" x-text="toast.title"></p>
            <p x-show="toast.message" class="mt-0.5 text-xs leading-relaxed text-gray-500 dark:text-gray-400" x-text="toast.message"></p>
          </div>
          <button @click="removeToast(toast.id)" class="mt-0.5 shrink-0 text-gray-400 transition-colors hover:text-gray-600 dark:hover:text-gray-300">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </template>
    </div>

    <div
      class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-8 shadow-xl dark:border-gray-700 dark:bg-gray-800"
    >
      <div class="mb-8 text-center">
        <h2 class="text-2xl font-bold text-gray-800 dark:text-white">
          Bem-vindo de volta
        </h2>
        <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
          Faça login para acessar o painel corporativo.
        </p>
      </div>

      <form @submit.prevent="realizarLogin(email, senha)" class="space-y-5">
        <div>
          <label
            class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300"
            >E-mail</label
          >
          <input
            x-model="email"
            type="email"
            required
            class="focus:border-brand-500 focus:ring-brand-500 dark:focus:border-brand-500 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-3 text-sm text-gray-800 placeholder-gray-400 dark:border-gray-700 dark:text-white"
            placeholder="Digite seu e-mail"
          />
        </div>

        <div>
          <label
            class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300"
            >Senha</label
          >
          <input
            x-model="senha"
            type="password"
            required
            class="focus:border-brand-500 focus:ring-brand-500 dark:focus:border-brand-500 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-3 text-sm text-gray-800 placeholder-gray-400 dark:border-gray-700 dark:text-white"
            placeholder="Digite sua senha"
          />
        </div>

        <button
          type="submit"
          class="bg-brand-500 hover:bg-brand-600 focus:ring-brand-500/20 w-full rounded-lg px-4 py-3 text-sm font-medium text-white transition focus:ring-4 focus:outline-none"
          style="background-color: #3b82f6"
        >
          Entrar
        </button>
      </form>
    </div>
  </body>
</html>
