<div class="mb-6">
  <include src="../breadcrumb.html"></include>

  <div class="mt-3 flex flex-col gap-3 rounded-2xl border border-gray-200 bg-white px-5 py-4 dark:border-gray-800 dark:bg-white/[0.03] sm:flex-row sm:items-center sm:justify-between">

    <!-- Esquerda: badge + título + descrição -->
    <div class="flex items-start gap-3">
      <div class="mt-0.5 h-full w-1 self-stretch rounded-full bg-brand-500 dark:bg-brand-400 shrink-0"></div>
      <div>
        <span
          class="inline-block rounded-full px-2.5 py-0.5 text-[10px] font-bold uppercase tracking-[0.14em]"
          :class="$store.navigation.getPageMeta(page).badgeClass"
          x-text="$store.navigation.getPageMeta(page).domainLabel"
        ></span>
        <h1
          class="mt-1 text-xl font-bold text-gray-900 dark:text-white"
          x-text="$store.navigation.getPageMeta(page).title"
        ></h1>
        <p
          class="mt-0.5 text-sm text-gray-500 dark:text-gray-400"
          x-text="$store.navigation.getPageMeta(page).description"
        ></p>
      </div>
    </div>

    <!-- Direita: chips de metadata -->
    <div class="flex shrink-0 flex-wrap items-center gap-2 sm:flex-nowrap">
      <div class="flex items-center gap-1.5 rounded-lg border border-gray-100 bg-gray-50 px-3 py-1.5 dark:border-gray-700 dark:bg-gray-800/60">
        <span class="text-[10px] font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500">Foco</span>
        <span class="text-xs font-semibold text-gray-700 dark:text-gray-200" x-text="$store.navigation.getPageMeta(page).focus"></span>
      </div>

      <div class="flex items-center gap-1.5 rounded-lg border border-gray-100 bg-gray-50 px-3 py-1.5 dark:border-gray-700 dark:bg-gray-800/60">
        <span class="text-[10px] font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500">Tipo</span>
        <span class="text-xs font-semibold text-gray-700 dark:text-gray-200" x-text="$store.navigation.getPageMeta(page).levelLabel"></span>
      </div>

      <div class="flex items-center gap-1.5 rounded-lg border border-gray-100 bg-gray-50 px-3 py-1.5 dark:border-gray-700 dark:bg-gray-800/60">
        <span class="text-[10px] font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500">Público</span>
        <span class="text-xs font-semibold text-gray-700 dark:text-gray-200" x-text="$store.navigation.getPageMeta(page).audience"></span>
      </div>

      <div class="flex items-center gap-1.5 rounded-lg border border-gray-100 bg-gray-50 px-3 py-1.5 dark:border-gray-700 dark:bg-gray-800/60">
        <span class="text-[10px] font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500">Cadência</span>
        <span class="text-xs font-semibold text-gray-700 dark:text-gray-200" x-text="$store.navigation.getPageMeta(page).cadence"></span>
      </div>
    </div>
  </div>
</div>
