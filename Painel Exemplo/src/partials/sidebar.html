<aside
  :class="sidebarToggle ? 'translate-x-0 lg:w-[90px]' : '-translate-x-full'"
  class="sidebar fixed top-0 left-0 z-9999 flex h-screen w-[290px] flex-col overflow-y-hidden border-r border-gray-200 bg-white px-5 lg:static lg:translate-x-0 dark:border-gray-800 dark:bg-black"
>
  <div
    :class="sidebarToggle ? 'justify-center' : 'justify-between'"
    class="sidebar-header flex items-center gap-2 pt-8 pb-7"
  >
    <a href="index.html">
      <span
        class="flex items-center gap-3 text-gray-800 dark:text-white/90"
        :class="sidebarToggle ? 'justify-center' : ''"
      >
        <span class="flex h-11 w-11 items-center justify-center rounded-2xl bg-brand-500 text-white shadow-theme-sm">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M5.5 3.25C4.25736 3.25 3.25 4.25736 3.25 5.5V8.99998C3.25 10.2426 4.25736 11.25 5.5 11.25H9C10.2426 11.25 11.25 10.2426 11.25 8.99998V5.5C11.25 4.25736 10.2426 3.25 9 3.25H5.5ZM4.75 5.5C4.75 5.08579 5.08579 4.75 5.5 4.75H9C9.41421 4.75 9.75 5.08579 9.75 5.5V8.99998C9.75 9.41419 9.41421 9.74998 9 9.74998H5.5C5.08579 9.74998 4.75 9.41419 4.75 8.99998V5.5ZM5.5 12.75C4.25736 12.75 3.25 13.7574 3.25 15V18.5C3.25 19.7426 4.25736 20.75 5.5 20.75H9C10.2426 20.75 11.25 19.7427 11.25 18.5V15C11.25 13.7574 10.2426 12.75 9 12.75H5.5ZM4.75 15C4.75 14.5858 5.08579 14.25 5.5 14.25H9C9.41421 14.25 9.75 14.5858 9.75 15V18.5C9.75 18.9142 9.41421 19.25 9 19.25H5.5C5.08579 19.25 4.75 18.9142 4.75 18.5V15ZM12.75 5.5C12.75 4.25736 13.7574 3.25 15 3.25H18.5C19.7426 3.25 20.75 4.25736 20.75 5.5V8.99998C20.75 10.2426 19.7426 11.25 18.5 11.25H15C13.7574 11.25 12.75 10.2426 12.75 8.99998V5.5ZM15 4.75C14.5858 4.75 14.25 5.08579 14.25 5.5V8.99998C14.25 9.41419 14.5858 9.74998 15 9.74998H18.5C18.9142 9.74998 19.25 9.41419 19.25 8.99998V5.5C19.25 5.08579 18.9142 4.75 18.5 4.75H15ZM15 12.75C13.7574 12.75 12.75 13.7574 12.75 15V18.5C12.75 19.7426 13.7574 20.75 15 20.75H18.5C19.7426 20.75 20.75 19.7427 20.75 18.5V15C20.75 13.7574 19.7426 12.75 18.5 12.75H15ZM14.25 15C14.25 14.5858 14.5858 14.25 15 14.25H18.5C18.9142 14.25 19.25 14.5858 19.25 15V18.5C19.25 18.9142 18.9142 19.25 18.5 19.25H15C14.5858 19.25 14.25 18.9142 14.25 18.5V15Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="block" :class="sidebarToggle ? 'hidden' : ''">
          <span class="block text-sm font-semibold tracking-[0.18em] uppercase">DashDesk</span>
          <span class="mt-1 block text-xs text-gray-500 dark:text-gray-400">Painel corporativo</span>
        </span>
      </span>
    </a>
  </div>

  <div class="no-scrollbar flex flex-col overflow-y-auto duration-300 ease-linear">
    <nav
      x-data="{
        selected: $persist('financeiro'),
        favs: $persist([]),
        init() {
          this.selected = $store.navigation.getGroupKey(page) || this.selected;
        },
        isFav(key) {
          return this.favs.some(f => f.key === key);
        },
        toggleFav(item, event) {
          event.preventDefault();
          event.stopPropagation();
          if (this.isFav(item.key)) {
            this.favs = this.favs.filter(f => f.key !== item.key);
          } else {
            this.favs = [...this.favs, item];
          }
        }
      }"
      x-init="selected = $store.navigation.getGroupKey(page) || selected"
    >

      <!-- ─── Favoritos ───────────────────────────────────────── -->
      <div x-show="favs.length > 0">
        <h3 class="mb-4 text-xs leading-[20px] text-gray-400 uppercase">
          <span class="menu-group-title" :class="sidebarToggle ? 'lg:hidden' : ''">Favoritos</span>
          <!-- ícone estrela quando collapsed -->
          <span :class="sidebarToggle ? 'lg:flex justify-center hidden' : 'hidden'">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" class="text-yellow-400">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </span>
        </h3>

        <ul class="mb-6 flex flex-col gap-3">
          <template x-for="fav in favs" :key="fav.key">
            <li>
              <div class="group/fav relative flex items-center">
                <a
                  :href="fav.href"
                  class="menu-item group flex-1"
                  :class="page === fav.key ? 'menu-item-active' : 'menu-item-inactive'"
                >
                  <span
                    class="flex h-6 w-6 items-center justify-center"
                    x-html="$store.navigation.getIcon(fav.icon, page === fav.key ? 'menu-item-icon-active' : 'menu-item-icon-inactive')"
                  ></span>
                  <span class="menu-item-text" :class="sidebarToggle ? 'lg:hidden' : ''" x-text="fav.label"></span>

                  <!-- Remover dos favoritos -->
                  <button
                    @click.prevent.stop="toggleFav(fav, $event)"
                    :class="sidebarToggle ? 'lg:hidden' : ''"
                    class="ml-auto flex h-5 w-5 items-center justify-center rounded opacity-0 transition-all group-hover/fav:opacity-100 hover:text-red-400"
                    title="Remover dos favoritos"
                  >
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" class="text-yellow-400">
                      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                  </button>
                </a>
              </div>
            </li>
          </template>
        </ul>
      </div>

      <!-- ─── Navegação ──────────────────────────────────────── -->
      <div>
        <h3 class="mb-4 text-xs leading-[20px] text-gray-400 uppercase">
          <span class="menu-group-title" :class="sidebarToggle ? 'lg:hidden' : ''">Navegação</span>
        </h3>
        <ul class="mb-6 flex flex-col gap-3">
          <li>
            <div class="group/item relative flex items-center">
              <a href="index.html" class="menu-item group flex-1" :class="page === 'overview' ? 'menu-item-active' : 'menu-item-inactive'">
                <span class="flex h-6 w-6 items-center justify-center" x-html="$store.navigation.getIcon('overview', page === 'overview' ? 'menu-item-icon-active' : 'menu-item-icon-inactive')"></span>
                <span class="menu-item-text" :class="sidebarToggle ? 'lg:hidden' : ''">Panorama geral</span>
                <button @click.prevent.stop="toggleFav({ key: 'overview', label: 'Panorama geral', href: 'index.html', icon: 'overview' }, $event)"
                  :class="[sidebarToggle ? 'lg:hidden' : '', isFav('overview') ? 'opacity-100' : 'opacity-0 group-hover/item:opacity-100']"
                  class="ml-auto flex h-5 w-5 items-center justify-center rounded transition-all"
                  :title="isFav('overview') ? 'Remover dos favoritos' : 'Adicionar aos favoritos'">
                  <svg width="12" height="12" viewBox="0 0 24 24" :fill="isFav('overview') ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" :class="isFav('overview') ? 'text-yellow-400' : 'text-gray-400 hover:text-yellow-400'">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                  </svg>
                </button>
              </a>
            </div>
          </li>
        </ul>
      </div>

      <!-- ─── Dashboards ─────────────────────────────────────── -->
      <div>
        <h3 class="mb-4 text-xs leading-[20px] text-gray-400 uppercase">
          <span class="menu-group-title" :class="sidebarToggle ? 'lg:hidden' : ''">Dashboards</span>
        </h3>
        <ul class="mb-6 flex flex-col gap-3">

          <template x-for="item in [
            { key: 'estrategico', label: 'Estratégico',  href: 'estrategico.html',  icon: 'overview'    },
            { key: 'operacional', label: 'Operacional',  href: 'operacional.html',  icon: 'operations'  },
            { key: 'financeiro',  label: 'Financeiro',   href: 'financeiro.html',   icon: 'finance'     },
            { key: 'comercial',   label: 'Comercial',    href: 'comercial.html',    icon: 'sales'       }
          ]" :key="item.key">
            <li>
              <div class="group/item relative flex items-center">
                <a :href="item.href" class="menu-item group flex-1" :class="page === item.key ? 'menu-item-active' : 'menu-item-inactive'">
                  <span class="flex h-6 w-6 items-center justify-center" x-html="$store.navigation.getIcon(item.icon, page === item.key ? 'menu-item-icon-active' : 'menu-item-icon-inactive')"></span>
                  <span class="menu-item-text" :class="sidebarToggle ? 'lg:hidden' : ''" x-text="item.label"></span>
                  <button @click.prevent.stop="toggleFav(item, $event)"
                    :class="[sidebarToggle ? 'lg:hidden' : '', isFav(item.key) ? 'opacity-100' : 'opacity-0 group-hover/item:opacity-100']"
                    class="ml-auto flex h-5 w-5 items-center justify-center rounded transition-all"
                    :title="isFav(item.key) ? 'Remover dos favoritos' : 'Adicionar aos favoritos'">
                    <svg width="12" height="12" viewBox="0 0 24 24" :fill="isFav(item.key) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" :class="isFav(item.key) ? 'text-yellow-400' : 'text-gray-400 hover:text-yellow-400'">
                      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                  </button>
                </a>
              </div>
            </li>
          </template>

        </ul>
      </div>

      <!-- ─── Módulos ────────────────────────────────────────── -->
      <div>
        <h3 class="mb-4 text-xs leading-[20px] text-gray-400 uppercase">
          <span class="menu-group-title" :class="sidebarToggle ? 'lg:hidden' : ''">Módulos</span>
        </h3>
        <ul class="mb-6 flex flex-col gap-3">

          <template x-for="item in [
            { key: 'clientes',  label: 'Clientes',     href: 'clientes.html',  icon: 'customers' },
            { key: 'estoque',   label: 'Estoque',      href: 'estoque.html',   icon: 'logistics' },
            { key: 'previsao',  label: 'Previsão',     href: 'previsao.html',  icon: 'forecast'  },
            { key: 'metas',     label: 'Metas e OKRs', href: 'metas.html',     icon: 'target'    },
            { key: 'analytics', label: 'Analytics',    href: 'analytics.html', icon: 'analytics' }
          ]" :key="item.key">
            <li>
              <div class="group/item relative flex items-center">
                <a :href="item.href" class="menu-item group flex-1" :class="page === item.key ? 'menu-item-active' : 'menu-item-inactive'">
                  <span class="flex h-6 w-6 items-center justify-center" x-html="$store.navigation.getIcon(item.icon, page === item.key ? 'menu-item-icon-active' : 'menu-item-icon-inactive')"></span>
                  <span class="menu-item-text" :class="sidebarToggle ? 'lg:hidden' : ''" x-text="item.label"></span>
                  <button @click.prevent.stop="toggleFav(item, $event)"
                    :class="[sidebarToggle ? 'lg:hidden' : '', isFav(item.key) ? 'opacity-100' : 'opacity-0 group-hover/item:opacity-100']"
                    class="ml-auto flex h-5 w-5 items-center justify-center rounded transition-all"
                    :title="isFav(item.key) ? 'Remover dos favoritos' : 'Adicionar aos favoritos'">
                    <svg width="12" height="12" viewBox="0 0 24 24" :fill="isFav(item.key) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" :class="isFav(item.key) ? 'text-yellow-400' : 'text-gray-400 hover:text-yellow-400'">
                      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                  </button>
                </a>
              </div>
            </li>
          </template>

        </ul>
      </div>

      <!-- ─── Sistema ────────────────────────────────────────── -->
      <div>
        <h3 class="mb-4 text-xs leading-[20px] text-gray-400 uppercase">
          <span class="menu-group-title" :class="sidebarToggle ? 'lg:hidden' : ''">Sistema</span>
        </h3>
        <ul class="mb-6 flex flex-col gap-3">

          <template x-for="item in [
            { key: 'calendario', label: 'Calendário',          href: 'calendario.html', icon: 'calendario' },
            { key: 'logs',       label: 'Logs do Sistema',    href: 'logs.html',       icon: 'logs'       },
            { key: 'empresa',    label: 'Detalhes da Empresa',href: 'empresa.html',    icon: 'empresa'    }
          ]" :key="item.key">
            <li>
              <div class="group/item relative flex items-center">
                <a :href="item.href" class="menu-item group flex-1" :class="page === item.key ? 'menu-item-active' : 'menu-item-inactive'">
                  <span class="flex h-6 w-6 items-center justify-center" x-html="$store.navigation.getIcon(item.icon, page === item.key ? 'menu-item-icon-active' : 'menu-item-icon-inactive')"></span>
                  <span class="menu-item-text" :class="sidebarToggle ? 'lg:hidden' : ''" x-text="item.label"></span>
                  <button @click.prevent.stop="toggleFav(item, $event)"
                    :class="[sidebarToggle ? 'lg:hidden' : '', isFav(item.key) ? 'opacity-100' : 'opacity-0 group-hover/item:opacity-100']"
                    class="ml-auto flex h-5 w-5 items-center justify-center rounded transition-all"
                    :title="isFav(item.key) ? 'Remover dos favoritos' : 'Adicionar aos favoritos'">
                    <svg width="12" height="12" viewBox="0 0 24 24" :fill="isFav(item.key) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" :class="isFav(item.key) ? 'text-yellow-400' : 'text-gray-400 hover:text-yellow-400'">
                      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                  </button>
                </a>
              </div>
            </li>
          </template>

        </ul>
      </div>

    </nav>
  </div>
</aside>
