<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Calendário | Dashboard Multidominio</title>
  </head>
  <body
    x-data="(() => {
      const shell = createAppShell('calendario');
      const _init = shell.init;
      return {
        ...shell,

        /* ── Calendário ── */
        calYear:  new Date().getFullYear(),
        calMonth: new Date().getMonth() + 1,
        events: [],
        loading: false,

        showModal: false,
        editingId: null,
        selectedDate: '',
        showDayPanel: false,
        panelDate: '',
        form: { titulo: '', descricao: '', cor: 'blue', hora: '' },

        colorMap: {
          blue:   { pill: 'bg-blue-100 text-blue-700 border border-blue-200 dark:bg-blue-500/20 dark:text-blue-300 dark:border-blue-500/30',   dot: 'bg-blue-500',   label: 'Azul'     },
          green:  { pill: 'bg-green-100 text-green-700 border border-green-200 dark:bg-green-500/20 dark:text-green-300 dark:border-green-500/30', dot: 'bg-green-500',  label: 'Verde'    },
          red:    { pill: 'bg-red-100 text-red-700 border border-red-200 dark:bg-red-500/20 dark:text-red-300 dark:border-red-500/30',         dot: 'bg-red-500',    label: 'Vermelho' },
          purple: { pill: 'bg-purple-100 text-purple-700 border border-purple-200 dark:bg-purple-500/20 dark:text-purple-300 dark:border-purple-500/30', dot: 'bg-purple-500', label: 'Roxo'     },
          orange: { pill: 'bg-orange-100 text-orange-700 border border-orange-200 dark:bg-orange-500/20 dark:text-orange-300 dark:border-orange-500/30', dot: 'bg-orange-500', label: 'Laranja'  },
          yellow: { pill: 'bg-yellow-100 text-yellow-800 border border-yellow-200 dark:bg-yellow-500/20 dark:text-yellow-200 dark:border-yellow-500/30', dot: 'bg-yellow-400', label: 'Amarelo'  },
        },

        /* ── Init ── */
        init() {
          _init.call(this);
          this.fetchEvents();
        },

        /* ── API ── */
        get apiBase() { return 'http://localhost:8000/api/calendario-eventos'; },
        get authHeaders() {
          const token = localStorage.getItem('auth_token');
          return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
        },

        async fetchEvents() {
          this.loading = true;
          try {
            const res = await fetch(
              this.apiBase + '?mes=' + this.calMonth + '&ano=' + this.calYear,
              { headers: this.authHeaders }
            );
            if (res.ok) this.events = await res.json();
          } catch(e) { console.error('Erro ao buscar eventos:', e); }
          finally { this.loading = false; }
        },

        async saveEvent() {
          if (!this.form.titulo.trim()) return;
          const payload = { ...this.form, data: this.selectedDate };
          try {
            let res;
            if (this.editingId) {
              res = await fetch(this.apiBase + '/' + this.editingId, {
                method: 'PUT', headers: this.authHeaders, body: JSON.stringify(payload),
              });
            } else {
              res = await fetch(this.apiBase, {
                method: 'POST', headers: this.authHeaders, body: JSON.stringify(payload),
              });
            }
            if (res.ok) {
              await this.fetchEvents();
              this.showModal = false;
            }
          } catch(e) { console.error('Erro ao salvar evento:', e); }
        },

        async deleteEvent(id) {
          try {
            const res = await fetch(this.apiBase + '/' + id, {
              method: 'DELETE', headers: this.authHeaders,
            });
            if (res.ok || res.status === 204) {
              this.events = this.events.filter(e => e.id !== id);
            }
          } catch(e) { console.error('Erro ao excluir evento:', e); }
        },

        /* ── Computed ── */
        get today() {
          const d = new Date(); const z = n => String(n).padStart(2,'0');
          return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate());
        },
        get monthName() {
          return new Date(this.calYear, this.calMonth - 1, 1)
            .toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
        },
        get days() {
          const first  = new Date(this.calYear, this.calMonth - 1, 1);
          const last   = new Date(this.calYear, this.calMonth, 0);
          const offset = (first.getDay() + 6) % 7;
          const result = [];
          for (let i = offset - 1; i >= 0; i--) {
            const d = new Date(this.calYear, this.calMonth - 1, -i);
            result.push({ dateStr: this.fmtDate(d), n: d.getDate(), curr: false });
          }
          for (let n = 1; n <= last.getDate(); n++) {
            const d = new Date(this.calYear, this.calMonth - 1, n);
            result.push({ dateStr: this.fmtDate(d), n, curr: true });
          }
          const fill = 42 - result.length;
          for (let n = 1; n <= fill; n++) {
            const d = new Date(this.calYear, this.calMonth, n);
            result.push({ dateStr: this.fmtDate(d), n, curr: false });
          }
          return result;
        },
        eventsOn(dateStr) { return this.events.filter(e => e.data === dateStr); },
        get panelEvents() { return this.eventsOn(this.panelDate); },
        get upcomingEvents() {
          return this.events
            .filter(e => e.data >= this.today)
            .sort((a,b) => a.data.localeCompare(b.data) || (a.hora||'').localeCompare(b.hora||''))
            .slice(0, 8);
        },

        /* ── Helpers ── */
        fmtDate(d) {
          const z = n => String(n).padStart(2,'0');
          return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate());
        },
        fmtDisplay(dateStr) {
          if (!dateStr) return '';
          const [y,m,n] = dateStr.split('-');
          return new Date(y, m-1, n).toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
        },
        isToday(dateStr) { return dateStr === this.today; },

        /* ── Navegação ── */
        prevMonth() {
          if (this.calMonth === 1) { this.calMonth = 12; this.calYear--; }
          else this.calMonth--;
          this.fetchEvents();
        },
        nextMonth() {
          if (this.calMonth === 12) { this.calMonth = 1; this.calYear++; }
          else this.calMonth++;
          this.fetchEvents();
        },
        goToday() {
          this.calYear  = new Date().getFullYear();
          this.calMonth = new Date().getMonth() + 1;
          this.fetchEvents();
        },

        /* ── Modal ── */
        openAdd(dateStr) {
          this.editingId    = null;
          this.selectedDate = dateStr;
          this.form = { titulo: '', descricao: '', cor: 'blue', hora: '' };
          this.showModal = true;
        },
        openEdit(ev) {
          this.editingId    = ev.id;
          this.selectedDate = ev.data;
          this.form = { titulo: ev.titulo, descricao: ev.descricao || '', cor: ev.cor || 'blue', hora: ev.hora || '' };
          this.showModal = true;
        },

        /* ── Painel do dia ── */
        openDayPanel(dateStr) {
          this.panelDate    = dateStr;
          this.showDayPanel = true;
        },
      };
    })()"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <include src="./partials/preloader.html"></include>

    <div class="flex h-screen overflow-hidden">
      <include src="./partials/sidebar.html"></include>

      <div class="relative flex flex-1 flex-col overflow-hidden">
        <include src="./partials/overlay.html" />
        <include src="./partials/header.html" />

        <!-- ─── Calendário ──────────────────────────────────── -->
        <div class="flex flex-1 flex-col overflow-hidden">

          <!-- Header de navegação -->
          <div class="flex shrink-0 items-center justify-between border-b border-gray-200 bg-white px-5 py-3 dark:border-gray-800 dark:bg-gray-900">
            <div class="flex items-center gap-3">
              <button @click="prevMonth()"
                class="flex h-8 w-8 items-center justify-center rounded-lg border border-gray-200 text-gray-600 transition hover:bg-gray-100 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
              </button>

              <h2 class="min-w-[200px] text-center text-lg font-bold capitalize text-gray-900 dark:text-white" x-text="monthName"></h2>

              <button @click="nextMonth()"
                class="flex h-8 w-8 items-center justify-center rounded-lg border border-gray-200 text-gray-600 transition hover:bg-gray-100 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </button>

              <button @click="goToday()"
                class="ml-1 rounded-lg border border-gray-200 px-3 py-1.5 text-xs font-semibold text-gray-700 transition hover:bg-gray-100 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800">
                Hoje
              </button>
            </div>

            <!-- Indicador de loading -->
            <div x-show="loading" class="flex items-center gap-1.5 text-xs text-gray-400">
              <svg class="h-3.5 w-3.5 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
              Carregando…
            </div>
          </div>

          <!-- Grid -->
          <div class="flex flex-1 overflow-hidden">

            <!-- Calendário principal -->
            <div class="flex flex-1 flex-col overflow-hidden">

              <!-- Cabeçalho dos dias -->
              <div class="grid shrink-0 grid-cols-7 border-b border-gray-200 bg-gray-50 dark:border-gray-800 dark:bg-gray-900">
                <template x-for="(d, i) in ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom']" :key="i">
                  <div class="py-2 text-center text-xs font-bold uppercase tracking-wide"
                    :class="i >= 5 ? 'text-rose-400' : 'text-gray-500 dark:text-gray-400'"
                    x-text="d"></div>
                </template>
              </div>

              <!-- Células dos dias -->
              <div class="grid flex-1 grid-cols-7" style="grid-template-rows: repeat(6, 1fr)">
                <template x-for="(day, idx) in days" :key="day.dateStr">
                  <div
                    @click="openDayPanel(day.dateStr)"
                    class="group relative cursor-pointer overflow-hidden border-b border-r border-gray-100 bg-white transition-colors hover:bg-gray-50/80 dark:border-gray-800 dark:bg-black dark:hover:bg-gray-800/40"
                    :class="[
                      !day.curr ? 'opacity-50' : '',
                      isToday(day.dateStr) ? '!bg-brand-50/40 dark:!bg-brand-500/5' : ''
                    ]"
                  >
                    <!-- Número do dia + botão + -->
                    <div class="flex items-center justify-between px-2 pt-1.5 pb-1">
                      <span
                        class="flex h-6 w-6 items-center justify-center rounded-full text-xs font-semibold"
                        :class="isToday(day.dateStr)
                          ? 'bg-brand-600 text-white dark:bg-brand-500'
                          : idx % 7 >= 5
                            ? 'text-rose-400'
                            : 'text-gray-700 dark:text-gray-300'"
                        x-text="day.n"
                      ></span>
                      <button
                        @click.stop="openAdd(day.dateStr)"
                        class="flex h-5 w-5 items-center justify-center rounded opacity-0 transition-opacity group-hover:opacity-100 hover:bg-gray-200 dark:hover:bg-gray-700"
                        title="Adicionar evento"
                      >
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="text-gray-500"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                      </button>
                    </div>

                    <!-- Eventos -->
                    <div class="space-y-0.5 px-1.5 pb-1">
                      <template x-for="ev in eventsOn(day.dateStr).slice(0, 3)" :key="ev.id">
                        <div
                          @click.stop="openEdit(ev)"
                          class="flex cursor-pointer items-center gap-1 truncate rounded px-1.5 py-0.5 text-[11px] font-medium leading-tight transition-opacity hover:opacity-75"
                          :class="colorMap[ev.cor]?.pill"
                        >
                          <span x-show="ev.hora" class="shrink-0 opacity-70" x-text="ev.hora"></span>
                          <span class="truncate" x-text="ev.titulo"></span>
                        </div>
                      </template>
                      <div
                        x-show="eventsOn(day.dateStr).length > 3"
                        @click.stop="openDayPanel(day.dateStr)"
                        class="cursor-pointer px-1.5 text-[10px] font-semibold text-brand-600 hover:underline dark:text-brand-400"
                        x-text="'+' + (eventsOn(day.dateStr).length - 3) + ' mais'"
                      ></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Painel lateral: próximos eventos -->
            <div class="hidden w-64 shrink-0 flex-col border-l border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900 xl:flex">
              <div class="border-b border-gray-200 px-4 py-3 dark:border-gray-800">
                <h3 class="text-sm font-semibold text-gray-900 dark:text-white">Próximos eventos</h3>
                <p class="mt-0.5 text-xs text-gray-400">A partir de hoje</p>
              </div>
              <div class="custom-scrollbar flex-1 overflow-y-auto p-3 space-y-1.5">
                <template x-if="upcomingEvents.length === 0">
                  <div class="flex flex-col items-center justify-center py-10 text-center">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="mb-2 text-gray-300 dark:text-gray-600"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <p class="text-xs text-gray-400">Nenhum evento futuro</p>
                  </div>
                </template>
                <template x-for="ev in upcomingEvents" :key="ev.id">
                  <div @click="openEdit(ev)" class="cursor-pointer rounded-lg p-2.5 transition-colors hover:bg-gray-50 dark:hover:bg-gray-800">
                    <div class="flex items-start gap-2">
                      <span class="mt-1 h-2 w-2 shrink-0 rounded-full" :class="colorMap[ev.cor]?.dot"></span>
                      <div class="min-w-0 flex-1">
                        <p class="truncate text-xs font-semibold text-gray-800 dark:text-white/90" x-text="ev.titulo"></p>
                        <p class="mt-0.5 text-[10px] capitalize text-gray-400" x-text="fmtDisplay(ev.data)"></p>
                        <p x-show="ev.hora" class="text-[10px] text-gray-400" x-text="ev.hora"></p>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>

        <!-- ─── Painel do dia ──────────────────────────────── -->
        <div
          x-show="showDayPanel"
          x-transition:enter="transition ease-out duration-200"
          x-transition:enter-start="opacity-0 translate-x-4"
          x-transition:enter-end="opacity-100 translate-x-0"
          x-transition:leave="transition ease-in duration-150"
          x-transition:leave-start="opacity-100 translate-x-0"
          x-transition:leave-end="opacity-0 translate-x-4"
          class="absolute right-0 z-30 flex w-72 flex-col border-l border-gray-200 bg-white shadow-xl dark:border-gray-700 dark:bg-gray-900 xl:right-64"
          style="top: 113px; bottom: 0;"
          @click.outside="showDayPanel = false"
        >
          <div class="flex items-center justify-between border-b border-gray-200 px-4 py-3 dark:border-gray-800">
            <div>
              <p class="text-[10px] font-bold uppercase tracking-wider"
                :class="isToday(panelDate) ? 'text-brand-500' : 'text-gray-400 dark:text-gray-500'"
                x-text="isToday(panelDate) ? 'Hoje' : new Date(panelDate + 'T00:00').toLocaleDateString('pt-BR', { weekday: 'long' })"></p>
              <h3 class="text-sm font-bold capitalize text-gray-900 dark:text-white"
                x-text="panelDate ? new Date(panelDate + 'T00:00').toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' }) : ''"></h3>
            </div>
            <button @click="showDayPanel = false" class="rounded-lg p-1.5 text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>

          <div class="custom-scrollbar flex-1 overflow-y-auto p-3 space-y-2">
            <template x-if="panelEvents.length === 0">
              <div class="flex flex-col items-center justify-center py-8 text-center">
                <p class="text-sm text-gray-400">Nenhum evento neste dia.</p>
                <button @click="openAdd(panelDate); showDayPanel = false"
                  class="mt-3 text-xs font-semibold text-brand-500 hover:underline dark:text-brand-400">
                  + Adicionar evento
                </button>
              </div>
            </template>
            <template x-for="ev in panelEvents" :key="ev.id">
              <div class="rounded-xl border p-3" :class="colorMap[ev.cor]?.pill">
                <div class="flex items-start justify-between gap-2">
                  <div class="min-w-0 flex-1">
                    <p class="font-semibold text-sm" x-text="ev.titulo"></p>
                    <p x-show="ev.hora" class="mt-0.5 text-xs opacity-70" x-text="ev.hora"></p>
                    <p x-show="ev.descricao" class="mt-1 text-xs opacity-75 leading-relaxed" x-text="ev.descricao"></p>
                  </div>
                  <div class="flex shrink-0 items-center gap-1">
                    <button @click="openEdit(ev); showDayPanel = false" class="rounded p-1 opacity-60 hover:opacity-100" title="Editar">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </button>
                    <button @click="deleteEvent(ev.id)" class="rounded p-1 opacity-60 hover:opacity-100 hover:text-red-500" title="Excluir">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6M14 11v6M9 6V4h6v2"></path></svg>
                    </button>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <div class="border-t border-gray-200 p-3 dark:border-gray-800">
            <button @click="openAdd(panelDate); showDayPanel = false"
              class="flex w-full items-center justify-center gap-2 rounded-lg border border-dashed border-gray-300 py-2 text-xs font-semibold text-gray-500 transition hover:border-brand-400 hover:text-brand-500 dark:border-gray-700 dark:text-gray-400">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Adicionar evento neste dia
            </button>
          </div>
        </div>

        <!-- ─── Modal: Adicionar / Editar evento ─────────── -->
        <div
          x-show="showModal"
          x-transition.opacity
          class="fixed inset-0 z-[100000] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4"
        >
          <div
            x-show="showModal"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 scale-100"
            x-transition:leave-end="opacity-0 scale-95"
            class="w-full max-w-md rounded-2xl border border-gray-200 bg-white shadow-2xl dark:border-gray-700 dark:bg-gray-900"
            @click.stop
          >
            <div class="flex items-center justify-between border-b border-gray-200 px-5 py-4 dark:border-gray-700">
              <div>
                <h3 class="font-semibold text-gray-900 dark:text-white" x-text="editingId ? 'Editar Evento' : 'Novo Evento'"></h3>
                <p class="mt-0.5 text-xs capitalize text-gray-500 dark:text-gray-400"
                  x-text="selectedDate ? new Date(selectedDate + 'T00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }) : ''"></p>
              </div>
              <button @click="showModal = false" class="rounded-lg p-1.5 text-gray-400 hover:bg-gray-100 hover:text-gray-600 dark:hover:bg-gray-800">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>

            <form @submit.prevent="saveEvent()" class="space-y-4 p-5">
              <!-- Título -->
              <div>
                <label class="mb-1 block text-xs font-semibold text-gray-700 dark:text-gray-300">Título <span class="text-red-400">*</span></label>
                <input type="text" x-model="form.titulo" required placeholder="Nome do evento"
                  class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm text-gray-900 focus:border-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
              </div>

              <!-- Data + Hora -->
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="mb-1 block text-xs font-semibold text-gray-700 dark:text-gray-300">Data</label>
                  <input type="date" x-model="selectedDate"
                    class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm text-gray-900 focus:border-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
                </div>
                <div>
                  <label class="mb-1 block text-xs font-semibold text-gray-700 dark:text-gray-300">Horário</label>
                  <input type="time" x-model="form.hora"
                    class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm text-gray-900 focus:border-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
                </div>
              </div>

              <!-- Descrição -->
              <div>
                <label class="mb-1 block text-xs font-semibold text-gray-700 dark:text-gray-300">Descrição (opcional)</label>
                <textarea x-model="form.descricao" rows="2" placeholder="Detalhes do evento..."
                  class="w-full resize-none rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm text-gray-900 focus:border-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white"></textarea>
              </div>

              <!-- Cor -->
              <div>
                <label class="mb-2 block text-xs font-semibold text-gray-700 dark:text-gray-300">Cor de destaque</label>
                <div class="flex gap-2.5">
                  <template x-for="(cfg, colorId) in colorMap" :key="colorId">
                    <button type="button" @click="form.cor = colorId"
                      class="relative flex h-7 w-7 items-center justify-center rounded-full transition ring-2 ring-offset-2"
                      :class="[cfg.dot, form.cor === colorId ? cfg.dot.replace('bg-','ring-') : 'ring-transparent']"
                      :title="cfg.label">
                      <svg x-show="form.cor === colorId" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </button>
                  </template>
                </div>

                <!-- Preview -->
                <div class="mt-2.5 flex items-center gap-2 rounded-lg border px-3 py-2 text-sm font-medium"
                  :class="colorMap[form.cor]?.pill">
                  <span x-show="form.hora" x-text="form.hora" class="text-xs opacity-70"></span>
                  <span x-text="form.titulo || 'Prévia do evento'"></span>
                </div>
              </div>

              <!-- Ações -->
              <div class="flex items-center justify-between pt-1">
                <button x-show="editingId" type="button" @click="deleteEvent(editingId); showModal = false"
                  class="flex items-center gap-1.5 rounded-lg px-3 py-2 text-xs font-semibold text-red-500 transition hover:bg-red-50 dark:hover:bg-red-500/10">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V4h6v2"></path></svg>
                  Excluir evento
                </button>
                <div class="flex gap-2" :class="editingId ? '' : 'ml-auto'">
                  <button type="button" @click="showModal = false"
                    class="rounded-lg border border-gray-200 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800">
                    Cancelar
                  </button>
                  <button type="submit"
                    class="bg-brand-600 hover:bg-brand-700 dark:bg-brand-500 rounded-lg px-4 py-2 text-sm font-semibold text-white">
                    <span x-text="editingId ? 'Salvar' : 'Adicionar'"></span>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </body>
</html>
