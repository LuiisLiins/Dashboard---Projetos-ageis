<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Logs de Sistema | Dashboard Multidominio</title>
  </head>
  <body
    x-data="{
      ...createAppShell('logs'),

      /* ── Estado ─────────────────────────── */
      atividades: [],
      kpis: { total: 0, sucesso: 0, erro: 0, aviso: 0 },
      logPagina: 1,
      logPerPage: 15,
      logTotal: 0,
      logLastPage: 1,
      logBusca: '',
      logTipo: '',
      logStatus: '',
      logCarregando: false,

      showModalNovo: false,
      novaAtividade: { usuario_nome: '', acao: '', alvo: '', tipo: 'info', status: 'Resolvido', recurso: '' },
      salvandoAtividade: false,

      /* ── Paginação ───────────────────────── */
      paginaAtual()    { return this.logPagina; },
      totalPaginas()   { return this.logLastPage; },
      paginasVisiveis() {
        const total = this.totalPaginas();
        const curr  = this.paginaAtual();
        const pages = [];
        for (let i = Math.max(1, curr - 2); i <= Math.min(total, curr + 2); i++) pages.push(i);
        return pages;
      },

      /* ── Carregar ────────────────────────── */
      async carregarLogs(pagina) {
        this.logCarregando = true;
        const token  = localStorage.getItem('auth_token');
        const params = new URLSearchParams({ page: pagina, per_page: this.logPerPage });
        if (this.logBusca)   params.append('buscar', this.logBusca);
        if (this.logTipo)    params.append('tipo',   this.logTipo);
        if (this.logStatus)  params.append('status', this.logStatus);

        try {
          const res  = await fetch('http://localhost:8000/api/atividades?' + params, {
            headers: { Authorization: 'Bearer ' + token }
          });
          const data = await res.json();
          this.atividades  = data.atividades   || [];
          this.kpis        = data.kpis         || { total: 0, sucesso: 0, erro: 0, aviso: 0 };
          this.logTotal    = data.total        || 0;
          this.logLastPage = data.last_page    || 1;
          this.logPagina   = data.current_page || 1;
        } catch (e) {
          console.error('Erro ao carregar logs:', e);
        } finally {
          this.logCarregando = false;
        }
      },

      async proximaPagina()   { if (this.logPagina < this.logLastPage) await this.carregarLogs(this.logPagina + 1); },
      async paginaAnterior()  { if (this.logPagina > 1)                await this.carregarLogs(this.logPagina - 1); },

      limparFiltros() {
        this.logBusca  = '';
        this.logTipo   = '';
        this.logStatus = '';
        this.carregarLogs(1);
      },

      /* ── Nova Atividade ──────────────────── */
      async salvarAtividade() {
        if (this.salvandoAtividade) return;
        this.salvandoAtividade = true;
        const token = localStorage.getItem('auth_token');
        try {
          const res = await fetch('http://localhost:8000/api/atividades', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify(this.novaAtividade)
          });
          if (res.ok) {
            this.showModalNovo  = false;
            this.novaAtividade  = { usuario_nome: '', acao: '', alvo: '', tipo: 'info', status: 'Resolvido', recurso: '' };
            await this.carregarLogs(1);
            this.showToast({ type: 'success', title: 'Evento registrado', message: 'Log criado com sucesso.' });
          } else {
            this.showToast({ type: 'error', title: 'Erro ao salvar', message: 'Verifique os dados e tente novamente.' });
          }
        } catch (e) {
          this.showToast({ type: 'error', title: 'Erro de conexão', message: 'Não foi possível registrar o evento.' });
        } finally {
          this.salvandoAtividade = false;
        }
      },

      /* ── Helpers de exibição ─────────────── */
      formatDate(str) {
        if (!str) return '—';
        const d = new Date(str);
        return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
      },
      tipoBadge(tipo) {
        const map = {
          success: 'bg-success-100 text-success-700 dark:bg-success-500/20 dark:text-success-300',
          error:   'bg-error-100 text-error-700 dark:bg-error-500/20 dark:text-error-300',
          warning: 'bg-warning-100 text-warning-700 dark:bg-warning-500/20 dark:text-warning-300',
          info:    'bg-blue-100 text-blue-700 dark:bg-blue-500/20 dark:text-blue-300',
        };
        return map[tipo] || map.info;
      },
      tipoLabel(tipo) {
        const map = { success: '✓ Sucesso', error: '✗ Erro', warning: '! Aviso', info: 'ℹ Info' };
        return map[tipo] || tipo;
      },
      statusBadge(status) {
        const map = {
          'Resolvido':    'bg-success-100 text-success-700 dark:bg-success-500/20 dark:text-success-300',
          'Pendente':     'bg-error-100 text-error-700 dark:bg-error-500/20 dark:text-error-300',
          'Em Progresso': 'bg-warning-100 text-warning-700 dark:bg-warning-500/20 dark:text-warning-300',
        };
        return map[status] || 'bg-gray-100 text-gray-700 dark:bg-gray-500/20 dark:text-gray-300';
      },

      /* ── Init ─────────────────────────────── */
      initLogs() {
        this.carregarLogs(1);
        // atualiza a cada 60s
        setInterval(() => { if (!this.showModalNovo) this.carregarLogs(this.logPagina); }, 60000);
      },
      async exportarRelatorio(format) {
        const pageMeta = Alpine.store('navigation').getPageMeta(this.page);
        await generateReport('logs', { logsKpis: this.kpis, atividades: this.atividades }, pageMeta, format);
      }
    }"
    x-init="init(); initLogs()"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <include src="./partials/preloader.html"></include>

    <div class="flex h-screen overflow-hidden">
      <include src="./partials/sidebar.html"></include>

      <div class="relative flex flex-1 flex-col overflow-x-hidden overflow-y-auto">
        <include src="./partials/overlay.html" />
        <include src="./partials/header.html" />

        <main>
          <div class="mx-auto max-w-(--breakpoint-2xl) p-4 md:p-6">
            <include src="./partials/dashboard/page-header.html"></include>
            <include src="./partials/dashboard/export-buttons.html"></include>

            <!-- KPIs -->
            <section class="mt-6 grid gap-4 md:grid-cols-2 xl:grid-cols-4">
              <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
                <div class="flex items-center justify-between">
                  <span class="text-sm font-medium text-gray-500 dark:text-gray-400">Total de Eventos</span>
                  <span class="bg-brand-50 text-brand-600 dark:bg-brand-500/15 dark:text-brand-300 flex h-8 w-8 items-center justify-center rounded-full">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                  </span>
                </div>
                <div class="mt-4">
                  <h4 class="text-2xl font-bold text-gray-800 dark:text-white/90" x-text="kpis.total.toLocaleString('pt-BR')"></h4>
                  <span class="text-gray-500 mt-1 flex items-center gap-1 text-sm">registros no sistema</span>
                </div>
              </div>

              <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
                <div class="flex items-center justify-between">
                  <span class="text-sm font-medium text-gray-500 dark:text-gray-400">Com Sucesso</span>
                  <span class="bg-success-50 text-success-600 dark:bg-success-500/15 dark:text-success-300 flex h-8 w-8 items-center justify-center rounded-full">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                  </span>
                </div>
                <div class="mt-4">
                  <h4 class="text-2xl font-bold text-gray-800 dark:text-white/90" x-text="kpis.sucesso"></h4>
                  <span class="text-success-500 mt-1 flex items-center gap-1 text-sm"
                    x-text="kpis.total > 0 ? (kpis.sucesso / kpis.total * 100).toFixed(1) + '% do total' : '—'"></span>
                </div>
              </div>

              <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
                <div class="flex items-center justify-between">
                  <span class="text-sm font-medium text-gray-500 dark:text-gray-400">Erros</span>
                  <span class="bg-error-50 text-error-600 dark:bg-error-500/15 dark:text-error-300 flex h-8 w-8 items-center justify-center rounded-full">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                  </span>
                </div>
                <div class="mt-4">
                  <h4 class="text-2xl font-bold text-gray-800 dark:text-white/90" x-text="kpis.erro"></h4>
                  <span class="text-error-500 mt-1 flex items-center gap-1 text-sm"
                    x-text="kpis.total > 0 ? (kpis.erro / kpis.total * 100).toFixed(1) + '% do total' : '—'"></span>
                </div>
              </div>

              <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
                <div class="flex items-center justify-between">
                  <span class="text-sm font-medium text-gray-500 dark:text-gray-400">Avisos</span>
                  <span class="bg-warning-50 text-warning-600 dark:bg-warning-500/15 dark:text-warning-300 flex h-8 w-8 items-center justify-center rounded-full">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                  </span>
                </div>
                <div class="mt-4">
                  <h4 class="text-2xl font-bold text-gray-800 dark:text-white/90" x-text="kpis.aviso"></h4>
                  <span class="text-warning-500 mt-1 flex items-center gap-1 text-sm"
                    x-text="kpis.total > 0 ? (kpis.aviso / kpis.total * 100).toFixed(1) + '% do total' : '—'"></span>
                </div>
              </div>
            </section>

            <!-- Tabela -->
            <section class="mt-6">
              <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">

                <!-- Cabeçalho -->
                <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                  <div>
                    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">Registro de Eventos</h3>
                    <p class="mt-0.5 text-sm text-gray-500 dark:text-gray-400">Atualiza automaticamente a cada 60 segundos</p>
                  </div>
                  <button
                    @click="showModalNovo = true"
                    class="bg-brand-500 hover:bg-brand-600 inline-flex shrink-0 items-center gap-2 rounded-lg px-4 py-2 text-sm font-medium text-white transition-colors"
                  >
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                    Registrar Evento
                  </button>
                </div>

                <!-- Filtros -->
                <div class="mb-4 flex flex-wrap gap-3">
                  <input
                    type="text"
                    placeholder="Buscar por usuário, ação ou recurso..."
                    x-model="logBusca"
                    @input.debounce.350ms="carregarLogs(1)"
                    class="min-w-[220px] flex-1 rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-800 dark:text-white"
                  />
                  <select x-model="logTipo" @change="carregarLogs(1)"
                    class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-800 dark:text-white">
                    <option value="">Todos os Tipos</option>
                    <option value="success">✓ Sucesso</option>
                    <option value="error">✗ Erro</option>
                    <option value="warning">! Aviso</option>
                    <option value="info">ℹ Info</option>
                  </select>
                  <select x-model="logStatus" @change="carregarLogs(1)"
                    class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-800 dark:text-white">
                    <option value="">Todos os Status</option>
                    <option value="Resolvido">Resolvido</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Em Progresso">Em Progresso</option>
                  </select>
                  <button
                    x-show="logBusca || logTipo || logStatus"
                    @click="limparFiltros()"
                    class="rounded-lg border border-gray-200 px-3 py-2 text-sm text-gray-600 transition-colors hover:bg-gray-50 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800"
                  >
                    Limpar filtros ×
                  </button>
                </div>

                <!-- Loading -->
                <div x-show="logCarregando" class="py-10 text-center text-sm text-gray-400 dark:text-gray-500">
                  <svg class="mx-auto mb-2 animate-spin" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 2v8"></path></svg>
                  Carregando eventos…
                </div>

                <!-- Tabela -->
                <div x-show="!logCarregando" class="w-full">
                  <table class="w-full text-sm">
                    <thead>
                      <tr class="border-b border-gray-200 dark:border-gray-700">
                        <th class="px-4 py-3 text-left font-semibold text-gray-700 dark:text-gray-300">Timestamp</th>
                        <th class="px-4 py-3 text-left font-semibold text-gray-700 dark:text-gray-300">Tipo</th>
                        <th class="px-4 py-3 text-left font-semibold text-gray-700 dark:text-gray-300">Usuário</th>
                        <th class="px-4 py-3 text-left font-semibold text-gray-700 dark:text-gray-300">Recurso</th>
                        <th class="px-4 py-3 text-left font-semibold text-gray-700 dark:text-gray-300">Status</th>
                        <th class="px-4 py-3 text-left font-semibold text-gray-700 dark:text-gray-300">Ação / Alvo</th>
                      </tr>
                    </thead>
                    <tbody>
                      <!-- Empty state -->
                      <tr x-show="atividades.length === 0">
                        <td colspan="6" class="px-4 py-10 text-center text-sm text-gray-500 dark:text-gray-400">
                          Nenhum evento encontrado para os filtros aplicados.
                        </td>
                      </tr>

                      <template x-for="log in atividades" :key="log.id">
                        <tr class="border-b border-gray-100 hover:bg-gray-50 dark:border-gray-800 dark:hover:bg-gray-800/50">
                          <td class="px-4 py-3 font-mono text-xs text-gray-500 dark:text-gray-400 whitespace-nowrap"
                              x-text="formatDate(log.created_at)"></td>

                          <td class="px-4 py-3">
                            <span class="inline-flex items-center gap-1 rounded-full px-2 py-1 text-xs font-medium"
                                  :class="tipoBadge(log.tipo)"
                                  x-text="tipoLabel(log.tipo)"></span>
                          </td>

                          <td class="px-4 py-3">
                            <div class="flex items-center gap-2">
                              <img :src="log.avatar_url" :alt="log.usuario_nome"
                                   class="h-6 w-6 rounded-full object-cover"
                                   onerror="this.style.display='none'"
                              />
                              <span class="text-gray-800 dark:text-gray-200" x-text="log.usuario_nome"></span>
                            </div>
                          </td>

                          <td class="px-4 py-3 font-mono text-xs text-gray-500 dark:text-gray-400"
                              x-text="log.recurso || '—'"></td>

                          <td class="px-4 py-3">
                            <span class="inline-block rounded-full px-2 py-1 text-xs font-medium"
                                  :class="statusBadge(log.status)"
                                  x-text="log.status"></span>
                          </td>

                          <td class="px-4 py-3 text-gray-600 dark:text-gray-400 max-w-xs">
                            <span class="font-medium text-gray-800 dark:text-gray-200" x-text="log.acao"></span>
                            <span class="text-gray-400 mx-1">→</span>
                            <span x-text="log.alvo"></span>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>

                <!-- Paginação -->
                <div class="mt-4 flex flex-col gap-3 border-t border-gray-200 pt-4 dark:border-gray-700 sm:flex-row sm:items-center sm:justify-between">
                  <p class="text-sm text-gray-500 dark:text-gray-400">
                    Mostrando
                    <span class="font-semibold text-gray-800 dark:text-gray-200"
                      x-text="(paginaAtual() - 1) * logPerPage + 1"></span>
                    –
                    <span class="font-semibold text-gray-800 dark:text-gray-200"
                      x-text="Math.min(paginaAtual() * logPerPage, logTotal)"></span>
                    de
                    <span class="font-semibold text-gray-800 dark:text-gray-200" x-text="logTotal"></span>
                    eventos
                  </p>

                  <div class="flex items-center gap-1">
                    <button @click="paginaAnterior()" :disabled="paginaAtual() <= 1"
                      class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-40 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300">←</button>

                    <template x-if="paginasVisiveis()[0] > 1">
                      <button @click="carregarLogs(1)" class="min-w-[2.25rem] rounded-lg border border-gray-200 px-2 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-700">1</button>
                    </template>
                    <template x-if="paginasVisiveis()[0] > 2">
                      <span class="select-none px-1 text-gray-400">…</span>
                    </template>

                    <template x-for="p in paginasVisiveis()" :key="p">
                      <button @click="carregarLogs(p)"
                        :class="p === paginaAtual()
                          ? 'bg-brand-600 text-white dark:bg-brand-500 border-brand-600 dark:border-brand-500'
                          : 'border-gray-200 text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-700'"
                        class="min-w-[2.25rem] rounded-lg border px-2 py-2 text-sm font-medium transition-colors"
                        x-text="p"></button>
                    </template>

                    <template x-if="totalPaginas() > 0 && paginasVisiveis()[paginasVisiveis().length - 1] < totalPaginas() - 1">
                      <span class="select-none px-1 text-gray-400">…</span>
                    </template>
                    <template x-if="totalPaginas() > 0 && paginasVisiveis()[paginasVisiveis().length - 1] < totalPaginas()">
                      <button @click="carregarLogs(totalPaginas())"
                        class="min-w-[2.25rem] rounded-lg border border-gray-200 px-2 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-700"
                        x-text="totalPaginas()"></button>
                    </template>

                    <button @click="proximaPagina()" :disabled="paginaAtual() >= totalPaginas()"
                      class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-40 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300">→</button>
                  </div>
                </div>

              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal: Registrar Novo Evento -->
    <div x-show="showModalNovo" style="display:none"
      class="fixed inset-0 z-[100000] flex items-center justify-center bg-gray-900/50 backdrop-blur-sm p-4">
      <div @click.outside="showModalNovo = false"
        x-show="showModalNovo"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-95"
        class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl dark:bg-gray-800">

        <div class="mb-5 flex items-center justify-between">
          <h3 class="text-xl font-bold text-gray-800 dark:text-white/90">Registrar Evento</h3>
          <button @click="showModalNovo = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <form @submit.prevent="salvarAtividade()" class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Usuário <span class="text-red-500">*</span></label>
              <input x-model="novaAtividade.usuario_nome" required type="text" placeholder="Ex: Maria Santos"
                class="w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:text-white" />
            </div>
            <div>
              <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Ação <span class="text-red-500">*</span></label>
              <input x-model="novaAtividade.acao" required type="text" placeholder="Ex: aprovou, criou"
                class="w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:text-white" />
            </div>
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Alvo / Descrição <span class="text-red-500">*</span></label>
            <input x-model="novaAtividade.alvo" required type="text" placeholder="Ex: Relatório de Vendas Q2"
              class="w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:text-white" />
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Recurso / Página</label>
            <input x-model="novaAtividade.recurso" type="text" placeholder="Ex: /dashboard/relatorios"
              class="w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:text-white" />
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Tipo</label>
              <select x-model="novaAtividade.tipo"
                class="w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm outline-none focus:border-brand-500 dark:border-gray-700 dark:text-white dark:bg-gray-700">
                <option value="success">✓ Sucesso</option>
                <option value="error">✗ Erro</option>
                <option value="warning">! Aviso</option>
                <option value="info">ℹ Info</option>
              </select>
            </div>
            <div>
              <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Status</label>
              <select x-model="novaAtividade.status"
                class="w-full rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm outline-none focus:border-brand-500 dark:border-gray-700 dark:text-white dark:bg-gray-700">
                <option value="Resolvido">Resolvido</option>
                <option value="Pendente">Pendente</option>
                <option value="Em Progresso">Em Progresso</option>
              </select>
            </div>
          </div>

          <div class="mt-6 flex justify-end gap-3">
            <button type="button" @click="showModalNovo = false"
              class="rounded-lg border border-gray-200 px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800">
              Cancelar
            </button>
            <button type="submit" :disabled="salvandoAtividade"
              class="flex items-center gap-2 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white hover:bg-brand-600 disabled:opacity-50 disabled:cursor-not-allowed">
              <span x-show="!salvandoAtividade">Salvar Evento</span>
              <span x-show="salvandoAtividade" class="flex items-center gap-2">
                <svg width="16" height="16" class="animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 2v8"></path></svg>
                Salvando…
              </span>
            </button>
          </div>
        </form>
      </div>
    </div>

  </body>
</html>
